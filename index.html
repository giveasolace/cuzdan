<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cüzdan</title>
<meta name="theme-color" content="#0f1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cüzdan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#121715; --muted:#68716d; --line:#e2e7e4;
  --accent:#16a34a; --accent2:#22c55e; --soft:#e8f7ee; --bad:#e5484d; --warn:#f59e0b; --info:#3d8bff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1412; --card:#18201c; --text:#eef3f0; --muted:#97a39d; --line:#26302b; --soft:#14301f; --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:30px;margin:4px 0 4px;letter-spacing:-.5px}
h2{font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-size:13px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--accent)} .neg{color:var(--bad)} .mut{color:var(--muted)}

.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mnav b{font-size:17px}
.mnav button{font-size:26px;line-height:1;padding:2px 14px;color:var(--accent)}

.hero{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;border-radius:22px;padding:18px 18px 16px}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px}
.hero .two{display:flex;gap:10px}
.hero .two div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.hero .two span{display:block;font-size:12px;opacity:.9}
.hero .two b{font-size:17px}

.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.row.tap{cursor:pointer}
.row.late .t span{color:var(--bad);font-weight:600}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin:16px 4px 6px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--bad)}
.brow{padding:12px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.brow .bh b{font-weight:600}
.brow .bh span{color:var(--muted);font-size:13px}

.donut{display:flex;align-items:center;gap:14px;padding:16px}
.donut svg{width:130px;height:130px;flex:none}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:20px;font-weight:800;margin-top:4px}

.btn{background:var(--accent);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;width:100%}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn.danger{background:none;color:var(--bad);box-shadow:none}
.btn.small{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.pill{background:var(--soft);color:var(--accent);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.pill.bad{background:#fde8e8;color:var(--bad)}
@media (prefers-color-scheme: dark){ .pill.bad{background:#3a1a1b} }
.linkbtn{color:var(--accent);font-weight:700;font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow > *{flex:1}

.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;flex:none}
.chips button.on{background:var(--accent);color:#fff}
.chips.wrap{flex-wrap:wrap;overflow:visible}

/* form */
.f{display:block;margin-bottom:12px}
.f > span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px 2px}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f2{display:flex;gap:10px} .f2 > *{flex:1;min-width:0}
.amtin{width:100%;border:0;background:none;font-size:42px;font-weight:800;text-align:center;outline:none;padding:6px 0 2px;letter-spacing:-1px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-bottom:8px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on.out{background:var(--bad);color:#fff}
.seg button.on.in{background:var(--accent);color:#fff}
.seg button.on{background:var(--accent);color:#fff}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.catgrid button{background:var(--card);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:600;box-shadow:var(--shadow);border:2px solid transparent}
.catgrid button div{font-size:24px;margin-bottom:3px}
.catgrid button.on{border-color:var(--accent);background:var(--soft)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:6px 0 14px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;align-items:flex-end}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600}
nav button svg{width:25px;height:25px}
nav button.on{color:var(--accent)}
nav button.plus{flex:none;width:58px;height:58px;margin:-22px 6px 0;border-radius:50%;background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;font-size:32px;font-weight:400;justify-content:center;box-shadow:0 6px 18px rgba(22,163,74,.4)}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-150%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:40;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30}
.modal.show{display:grid;place-items:end center;animation:fade .25s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-head h3{margin:0;font-size:21px}
.sh-head button{font-size:16px;color:var(--muted);background:var(--card);width:34px;height:34px;border-radius:50%}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--accent)} .tgl.on::after{left:21px}
.nrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow span{flex:1;font-weight:600;font-size:15px}
.nrow select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:15px}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0;line-height:1.45}
</style>
</head>
<body>
<div id="app">

  <!-- ÖZET -->
  <section class="view on" id="v-home">
    <div class="mnav"><button data-mn="-1" aria-label="Önceki ay">‹</button><b class="mTitle"></b><button data-mn="1" aria-label="Sonraki ay">›</button></div>
    <div class="hero">
      <div class="lbl">Bu ay kalan</div>
      <div class="big num" id="hLeft">0 ₺</div>
      <div class="two"><div><span>Gelir</span><b class="num" id="hIn">0 ₺</b></div><div><span>Gider</span><b class="num" id="hOut">0 ₺</b></div></div>
    </div>
    <h2>Bütçe <button class="linkbtn" id="editBudget">Ayarla</button></h2>
    <div class="card" id="budgetBox"></div>
    <h2>Nereye gitti?</h2>
    <div class="card" id="donutBox"></div>
    <h2>Yaklaşan ödemeler <button class="linkbtn" data-go="bills">Tümü</button></h2>
    <div class="card" id="upBox"></div>
    <div id="needCard" style="margin-top:12px"></div>
    <h2>Net varlık <button class="linkbtn" data-go="assets">Detay</button></h2>
    <div class="kpis" id="netBox"></div>
  </section>

  <!-- İŞLEMLER -->
  <section class="view" id="v-tx">
    <div class="mnav"><button data-mn="-1" aria-label="Önceki ay">‹</button><b class="mTitle"></b><button data-mn="1" aria-label="Sonraki ay">›</button></div>
    <input class="search" id="txSearch" placeholder="Ara (not, kategori)" autocomplete="off">
    <div class="chips" id="txCats"></div>
    <div id="txList"></div>
  </section>

  <!-- ÖDEMELER -->
  <section class="view" id="v-bills">
    <h1 id="billH">Ödemeler</h1>
    <div class="seg" id="billSeg" style="margin:8px 0 14px"><button data-seg="pay">Ödemeler</button><button data-seg="people">Borç/Alacak</button><button data-seg="needs">İhtiyaçlar</button></div>
    <div id="segPay">
      <div class="kpis" id="billKpis"></div>
      <div id="billList"></div>
      <button class="btn" id="addBill" style="margin-top:16px">+ Ödeme ekle</button>
    </div>
    <div id="segPeople" hidden>
      <div class="kpis" id="pplKpis"></div>
      <div id="pplList"></div>
      <button class="btn" id="addPerson" style="margin-top:16px">+ Kişi ekle</button>
    </div>
    <div id="segNeeds" hidden>
      <div class="card pad" id="needSum"></div>
      <div class="card pad" style="margin-top:12px">
        <div class="f2"><label class="f" style="flex:2"><span>Ne lazım?</span><input id="nName" placeholder="Örn: Kış montu" autocomplete="off"></label>
        <label class="f"><span>Tahmini tutar</span><input id="nAmt" inputmode="decimal" placeholder="0 ₺"></label></div>
        <div class="chips wrap" id="nPrio"></div>
        <button class="btn" id="nAdd">+ Listeye ekle</button>
      </div>
      <div id="needList"></div>
    </div>
  </section>

  <!-- VARLIK -->
  <section class="view" id="v-assets">
    <h1>Varlıklar</h1>
    <div class="hero" style="margin-top:10px">
      <div class="lbl">Toplam varlık</div>
      <div class="big num" id="aTotal">0 ₺</div>
      <div class="two"><div><span>Kâr / zarar</span><b class="num" id="aPnl">0 ₺</b></div><div><span>Bugün</span><b class="num" id="aDay">—</b></div></div>
    </div>
    <h2>Yatırımlar <small id="pAt"></small></h2>
    <div class="card" id="assetList"></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="refreshP">↻ Fiyatları yenile</button><button class="btn" id="addAsset">+ Varlık ekle</button></div>
    <h2>Birikim hedefleri</h2>
    <div class="card" id="goalList"></div>
    <button class="btn ghost" id="addGoal" style="margin-top:10px">+ Hedef ekle</button>
    <h2>Ayarlar</h2>
    <p class="sub" id="nStatus" style="margin-bottom:8px"></p>
    <div class="card" id="nRows"></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="nOn">🔔 Bildirimleri aç</button><button class="btn ghost" id="nTest">Test gönder</button></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="editCats">🏷️ Kategoriler</button></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="exp">Dışa aktar</button><label class="btn ghost" style="text-align:center">İçe aktar<input type="file" id="imp" accept="application/json" hidden></label></div>
    <button class="btn danger" id="wipe" style="margin-top:6px">Tüm verileri sil</button>
    <p class="sub" style="text-align:center;margin-top:8px">Veriler sadece bu telefonda saklanır.</p>
  </section>
</div>

<nav id="tabs">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Özet</button>
  <button data-v="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>İşlemler</button>
  <button class="plus" id="plus" aria-label="İşlem ekle">+</button>
  <button data-v="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Ödemeler</button>
  <button data-v="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Varlık</button>
</nav>

<div class="toast" id="toast"></div>
<div class="modal" id="sheet"><div class="sheet"><div class="sh-head"><h3 id="shTitle"></h3><button id="shClose" aria-label="Kapat">✕</button></div><div id="shBody"></div></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const KEY = 'cuzdan-v1';
const PUSH_URL = 'https://motive-push.giveasolace.workers.dev';
const VAPID_PUBLIC = 'BDMdAzvj94MzI0-fdgNqQo2l1xFBlVZwofnCFR-s7VGeC691tq6rC4GgPykihlS6JHeDCmz10boJzT9p6pbDpck';
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const COLORS = ['#16a34a','#3d8bff','#f59e0b','#e5484d','#a855f7','#14b8a6','#ec4899','#84cc16','#f97316','#6366f1','#0ea5e9','#78716c'];

const DEF_OUT = [['market','Market','🛒'],['yemek','Yemek','🍔'],['ulasim','Ulaşım','🚗'],['fatura','Fatura','💡'],['kira','Kira','🏠'],['saglik','Sağlık','💊'],
  ['giyim','Giyim','👕'],['eglence','Eğlence','🎬'],['abonelik','Abonelik','📺'],['egitim','Eğitim','📚'],['borc','Kart/Borç','💳'],['diger','Diğer','📦']];
const DEF_IN = [['maas','Maaş','💼'],['ek','Ek gelir','💰'],['yatirim','Yatırım','📈'],['diger_in','Diğer','📥']];
const toCats = a => a.map(([id,name,emoji])=>({id,name,emoji}));

const defaults = () => ({
  tx:[], cats:{out:toCats(DEF_OUT), in:toCats(DEF_IN)}, budget:{total:0, cats:{}}, goals:[], bills:[], assets:[],
  prices:{}, pricesAt:0, notif:{hour:10, daysBefore:2, subscribed:false}, testAt:0,
  people:[], needs:[], ui:{billSeg:'pay'}, migrated:false
});
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY)||'{}')); } catch(e){ S = defaults(); }
var snapT; function queueSnap(){ clearTimeout(snapT); snapT=setTimeout(()=>{ writeSnap(); syncPush(); },400); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} queueSnap(); };

// ---------- yardımcılar ----------
const pad = n => String(n).padStart(2,'0');
const dkey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1);
const today = () => dkey();
const addDays = (k,n) => { const d=new Date(k+'T12:00'); d.setDate(d.getDate()+n); return dkey(d); };
const addMonths = (m,n) => { const [y,mo]=m.split('-').map(Number); return mkey(new Date(y, mo-1+n, 1)); };
const dim = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const dueOf = (m,day) => m+'-'+pad(Math.min(day, dim(m)));
const diffDays = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const monthName = m => { const [y,mo]=m.split('-').map(Number); return MONTHS[mo-1]+' '+y; };
const dayName = k => new Date(k+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
const shortDate = k => new Date(k+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, sign) => { const v=Math.abs(n)>=1000?Math.round(n):Math.round(n*100)/100;
  const s = Math.abs(v).toLocaleString('tr-TR',{minimumFractionDigits:0, maximumFractionDigits:2})+' ₺';
  return (v<0?'−':(sign&&v>0?'+':''))+s; };
const parseAmt = s => { s=String(s||'').trim().replace(/\s|₺/g,''); if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');      // 1.250,50
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');   // 40.000 / 1.250.000 → binlik ayırıcı
  return parseFloat(s); };
const amtStr = n => n ? String(Math.round(n*100)/100).replace('.',',') : '';

const monthTx = m => S.tx.filter(t=>t.date.startsWith(m));
function sums(m){ let i=0,o=0; const by={}; for(const t of monthTx(m)){ if(t.type==='in') i+=t.amount; else { o+=t.amount; by[t.cat]=(by[t.cat]||0)+t.amount; } } return {i,o,by}; }

function readTxForm(){ form.amount=parseAmt($('#fAmt').value); form.date=$('#fDate').value||today(); form.note=$('#fNote').value.trim(); }
function txFormClick(e){
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.type){ readTxForm(); if(form.type!==b.dataset.type){ form.type=b.dataset.type; form.cat=''; } drawTxForm(); return; }
  if(b.dataset.cat){ $$('#shBody .catgrid button').forEach(x=>x.classList.toggle('on',x===b)); form.cat=b.dataset.cat; return; }
  if(b.dataset.a==='del'){ if(!confirm('Bu işlem silinsin mi?')) return; S.tx=S.tx.filter(t=>t.id!==form.id); save(); closeSheet(); renderAll(); toast('Silindi'); return; }
  if(b.dataset.a==='save'){
    readTxForm();
    if(!(form.amount>0)) return toast('Tutarı yaz');
    if(!form.cat) return toast('Kategori seç');
    const t={id:form.id||uid(), type:form.type, amount:Math.round(form.amount*100)/100, cat:form.cat, note:form.note, date:form.date, ...(form.bill?{bill:form.bill}:{})};
    if(form.id) S.tx=S.tx.map(x=>x.id===t.id?t:x); else S.tx.push(t);
    save(); closeSheet(); buzz(); renderAll();
    toast(budgetWarn(t) || (t.type==='in'?'💰 Gelir kaydedildi':'Kaydedildi ✓'));
  }
}
function budgetWarn(t){
  if(t.type!=='out') return '';
  const m=t.date.slice(0,7), s=sums(m), c=catOf('out',t.cat);
  const lim=S.budget.cats[t.cat];
  if(lim){ const r=(s.by[t.cat]||0)/lim; if(r>=1) return `⚠️ ${c.name} bütçesi aşıldı (${fmt(s.by[t.cat])} / ${fmt(lim)})`; if(r>=.8) return `${c.name} bütçesinin %${Math.round(r*100)}'i doldu`; }
  if(S.budget.total){ const r=s.o/S.budget.total; if(r>=1) return `⚠️ Aylık bütçe aşıldı`; if(r>=.8) return `Aylık bütçenin %${Math.round(r*100)}'i doldu`; }
  return '';
}

const BK = {fatura:['💡','Fatura / kira'], kart:['💳','Kredi kartı'], taksit:['📆','Taksit'], borc:['🤝','Borç'], alacak:['💸','Alacak']};
const isOnce = b => b.kind==='borc' || b.kind==='alacak';
function nextOcc(b){
  if(isOnce(b)) return b.paid.once ? null : {date:b.date, key:'once'};
  const n = b.kind==='taksit' ? b.count : 1200;
  let m=b.start; for(let i=0;i<n;i++, m=addMonths(m,1)) if(!b.paid[m]) return {date:dueOf(m,b.dueDay), key:m, idx:i+1};
  return null;
}
function occUntil(b, until){
  if(isOnce(b)) return (!b.paid.once && b.date<=until) ? [{date:b.date, key:'once'}] : [];
  const out=[], n=b.kind==='taksit'?b.count:1200; let m=b.start;
  for(let i=0;i<n;i++, m=addMonths(m,1)){ const d=dueOf(m,b.dueDay); if(d>until) break; if(!b.paid[m]) out.push({date:d, key:m, idx:i+1}); }
  return out;
}
function upcoming(){ return S.bills.map(b=>({b, o:nextOcc(b)})).filter(x=>x.o).sort((a,b)=>a.o.date.localeCompare(b.o.date)); }
const paidCount = b => Object.keys(b.paid).length;
function debtLeft(){ return S.bills.reduce((s,b)=> s + (b.kind==='taksit' ? Math.max(0,b.count-paidCount(b))*b.amount : b.kind==='borc' && !b.paid.once ? b.amount : 0), 0)
  + S.people.reduce((s,p)=>{ const b=bal(p); return s+(b<0?-b:0); }, 0); }
function receivable(){ return S.bills.reduce((s,b)=> s + (b.kind==='alacak' && !b.paid.once ? b.amount : 0), 0)
  + S.people.reduce((s,p)=>{ const b=bal(p); return s+(b>0?b:0); }, 0); }

// ---------- kişiler: borç / alacak ----------
const PT = {lend:['Borç verdim',1,'💸'], borrow:['Borç aldım',-1,'🤲'], payIn:['Ödeme aldım',-1,'📥'], payOut:['Ödeme yaptım',1,'📤']};
const bal = p => Math.round(p.entries.reduce((s,e)=>s+PT[e.t][1]*e.amount,0)*100)/100;
const open = p => Math.abs(bal(p))>0.004;
const balText = b => b>0.004 ? `sana ${fmt(b)} borçlu` : b<-0.004 ? `ona ${fmt(-b)} borçlusun` : 'hesap kapandı';
function migrate(){
  if(S.migrated) return;
  for(const b of S.bills.filter(isOnce)){
    if(b.paid.once || !(b.amount>0)) continue;
    let p=S.people.find(x=>x.name.toLocaleLowerCase('tr')===b.name.toLocaleLowerCase('tr'));
    if(!p){ p={id:uid(), name:b.name, entries:[]}; S.people.push(p); }
    p.entries.push({id:uid(), t:b.kind==='alacak'?'lend':'borrow', amount:b.amount, date:b.date, note:'Önceki kayıttan'}); p.due=b.date;
  }
  S.bills=S.bills.filter(b=>!isOnce(b)); S.migrated=true; save();
}

  const list=[...S.people].sort((a,b)=>(open(b)-open(a))||Math.abs(bal(b))-Math.abs(bal(a)));
  $('#pplList').innerHTML = list.length ? `<div class="card" style="margin-top:14px">${list.map(p=>{

      <div class="amt num ${b>0.004?'pos':b<-0.004?'neg':'mut'}">${o?fmt(Math.abs(b)):'—'}</div></div>`; }).join('')}</div>`
    : `<div class="card" style="margin-top:14px"><div class="empty">Kime borcun var, kimden alacağın var?<br>Kişiyi ekle; verdikçe, aldıkça, ödedikçe yaz — bakiyeyi ben tutayım.</div></div>`;
}

const PRIO = {acil:['🔴','Acil',0], normal:['🟡','Normal',1], sonra:['⚪','Sonra',2]};

const openNeeds = () => S.needs.filter(n=>!n.done).sort((a,b)=>PRIO[a.prio][2]-PRIO[b.prio][2] || a.created-b.created);
function renderNeeds(){
  const ol=openNeeds(), total=ol.reduce((s,n)=>s+(n.amount||0),0), sm=sums(mkey()), left=sm.i-sm.o;
  const r = left>0 ? total/left : null;
  $('#needSum').innerHTML = ol.length
    ? `<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">${ol.length} ihtiyaç</b><b class="num" style="font-size:22px">${fmt(total)}</b></div>
       ${ol.some(n=>n.prio==='acil')?`<div class="note" style="margin-top:4px">🔴 Acil olanlar: ${fmt(ol.filter(n=>n.prio==='acil').reduce((s,n)=>s+(n.amount||0),0))}</div>`:''}

    : `<div class="empty" style="padding:6px">İhtiyaç listen boş. Aşağıdan ekle; neye ne kadar lazım, hep önünde dursun.</div>`;

  const done=S.needs.filter(n=>n.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,20);

    + (done.length ? `<h2>Alındı</h2><div class="card">${done.map(n=>{ const d=(n.paid||0)-(n.amount||0);

}

function billRow({b,o}){

function renderBills(){
  const up=upcoming(), t=today(), in30=addDays(t,30), m=mkey();

document.addEventListener('click', e => {

function payBill(b){

  openSheet(inc?'Alındı olarak işaretle':'Ödendi olarak işaretle', `

      const n=nextOcc(b); toast(n ? `✓ Sonraki: ${shortDate(n.date)}` : (b.kind==='taksit'?'🎉 Son taksit ödendi!':'✓ Kapatıldı'));

let bf=null;
function billForm(b){
  bf = b ? {...b} : {kind:'fatura', name:'', amount:0, dueDay:new Date().getDate(), date:addDays(today(),7), count:12, paidN:0};
  drawBillForm();
}
function drawBillForm(){
  const f=bf, once=isOnce(f);
  openSheet(f.id?'Ödemeyi düzenle':'Yeni ödeme', `
    ${f.id?'':`<div class="chips wrap">${Object.entries(BK).filter(([k])=>!isOnce({kind:k})).map(([k,[em,n]])=>`<button data-kind="${k}" class="${f.kind===k?'on':''}">${em} ${n}</button>`).join('')}</div>`}
    <label class="f"><span>Ad</span><input id="bName" value="${esc(f.name)}" placeholder="${{fatura:'Örn: Kira, Elektrik, İnternet',kart:'Örn: Garanti kart',taksit:'Örn: Telefon taksidi',borc:'Örn: Ahmet\'e borç',alacak:'Örn: Mehmet\'ten alacak'}[f.kind]}" autocomplete="off"></label>
    <div class="f2"><label class="f"><span>${f.kind==='kart'?'Tahmini tutar':'Tutar'}</span><input id="bAmt" inputmode="decimal" value="${amtStr(f.amount)}" placeholder="0 ₺"></label>
    ${once ? `<label class="f"><span>Tarih</span><input type="date" id="bDate" value="${f.date}"></label>`
           : `<label class="f"><span>Her ayın</span><select id="bDay">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${f.dueDay===i+1?'selected':''}>${i+1}. günü</option>`).join('')}</select></label>`}</div>
    ${f.kind==='taksit' && !f.id ? `<div class="f2"><label class="f"><span>Toplam taksit</span><input id="bCount" inputmode="numeric" value="${f.count}"></label><label class="f"><span>Ödenmiş taksit</span><input id="bPaid" inputmode="numeric" value="${f.paidN||0}"></label></div>` : ''}
    ${f.kind==='taksit' && f.id ? `<p class="note">${paidCount(f)}/${f.count} taksit ödendi.</p>` : ''}
    ${f.kind==='kart' ? '<p class="note">Tutar her ay değişir; "Ödendi" derken o ayın ekstresini yazarsın.</p>' : ''}
    <button class="btn" data-a="save" style="margin-top:6px">Kaydet</button>
    ${f.id ? `${!isOnce(f)&&paidCount(f)?'<button class="btn ghost" data-a="undo" style="margin-top:10px">Son ödemeyi geri al</button>':''}<button class="btn danger" data-a="del">Ödemeyi sil</button>` : ''}`, billFormClick);
}
function readBillForm(){
  bf.name=$('#bName').value.trim(); bf.amount=parseAmt($('#bAmt').value)||0;
  if($('#bDate')) bf.date=$('#bDate').value||today();
  if($('#bDay')) bf.dueDay=+$('#bDay').value;
  if($('#bCount')){ bf.count=Math.max(1,parseInt($('#bCount').value)||1); bf.paidN=Math.min(bf.count,Math.max(0,parseInt($('#bPaid').value)||0)); }
}
function billFormClick(e){
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.kind){ readBillForm(); bf.kind=b.dataset.kind; drawBillForm(); return; }
  const a=b.dataset.a; if(!a) return;
  const real=S.bills.find(x=>x.id===bf.id);
  if(a==='del'){ if(!confirm(`"${bf.name}" silinsin mi?`)) return; S.bills=S.bills.filter(x=>x.id!==bf.id); save(); closeSheet(); renderAll(); return; }
  if(a==='undo'){ const ks=Object.keys(real.paid).sort(); delete real.paid[ks[ks.length-1]]; save(); closeSheet(); renderAll(); toast('Geri alındı'); return; }
  readBillForm();
  if(!bf.name) return toast('Ad yaz');
  if(bf.kind!=='kart' && !(bf.amount>0)) return toast('Tutarı yaz');
  if(real){ Object.assign(real,{name:bf.name, amount:bf.amount, dueDay:bf.dueDay, date:bf.date}); }
  else {
    const nb={id:uid(), kind:bf.kind, name:bf.name, amount:bf.amount, paid:{}, cat:{fatura:'fatura',kart:'borc',taksit:'borc',borc:'borc',alacak:'diger_in'}[bf.kind]};
    if(isOnce(nb)) nb.date=bf.date;
    else {
      nb.dueDay=bf.dueDay;
      const first = new Date().getDate()>bf.dueDay ? addMonths(mkey(),1) : mkey();
      if(nb.kind==='taksit'){ nb.count=bf.count; nb.start=addMonths(first,-bf.paidN); for(let i=0;i<bf.paidN;i++) nb.paid[addMonths(nb.start,i)]=true; }
      else nb.start=first;
    }
    S.bills.push(nb);
  }
  save(); closeSheet(); renderAll(); toast('Kaydedildi ✓');
}
$('#addBill').onclick = () => billForm();

// ---------- varlıklar ----------
const AK = {gold:['🥇','Altın'], fx:['💵','Döviz'], stock:['📈','Hisse'], crypto:['🪙','Kripto'], fund:['🧺','Fon'], cash:['🏦','Nakit / mevduat']};
const GOLD = [['GRAM','Gram altın'],['CEYREK','Çeyrek altın'],['YARIM','Yarım altın'],['TAM','Tam altın'],['GUMUS','Gram gümüş']];
const FX = [['USDTRY=X','Dolar'],['EURTRY=X','Euro'],['GBPTRY=X','Sterlin'],['CHFTRY=X','İsviçre frangı']];
const unitPrice = a => a.kind==='cash' ? 1 : a.kind==='fund' ? (a.manual||a.cost||0) : (S.prices[a.sym]?.p ?? a.cost ?? 0);
function assetTotals(){
  let value=0, cost=0, day=0, dayBase=0;
  for(const a of S.assets){ const v=a.qty*unitPrice(a); value+=v; cost+=a.qty*(a.kind==='cash'?1:(a.cost||unitPrice(a)));
    const ch=S.prices[a.sym]?.chg; if(ch!=null && a.kind!=='cash' && a.kind!=='fund'){ day+=v-v/(1+ch/100); dayBase+=v/(1+ch/100); } }
  return {value, pnl:value-cost, pct:cost?(value/cost-1)*100:0, day, dayPct: dayBase?day/dayBase*100:null};
}
async function fetchPrices(force){
  const syms=[...new Set(S.assets.filter(a=>a.sym && a.kind!=='fund' && a.kind!=='cash').map(a=>a.sym))];
  if(!syms.length) return;
  if(!force && Date.now()-S.pricesAt<10*60*1000) return;
  try{
    const r=await fetch(PUSH_URL+'/prices?s='+encodeURIComponent(syms.join(','))); const j=await r.json();
    for(const [k,v] of Object.entries(j.prices||{})) if(v && v.p) S.prices[k]={p:v.p, chg:v.chg, at:j.at};
    S.pricesAt=Date.now(); save(); renderAll(); if(force) toast('Fiyatlar güncellendi');
  }catch(e){ if(force) toast('Fiyatlar alınamadı (internet?)'); }
}
function renderAssets(){
  const t=assetTotals();
  $('#aTotal').textContent=fmt(t.value);
  $('#aPnl').innerHTML=`${fmt(t.pnl,true)} <small style="font-size:12px;opacity:.9">(${t.pct>=0?'+':''}${t.pct.toFixed(1)}%)</small>`;
  $('#aDay').textContent = t.dayPct==null ? '—' : `${fmt(t.day,true)} (${t.dayPct>=0?'+':''}${t.dayPct.toFixed(2)}%)`;
  $('#pAt').textContent = S.pricesAt ? 'Fiyatlar: '+new Date(S.pricesAt).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  $('#assetList').innerHTML = S.assets.length ? S.assets.map(a=>{
    const up=unitPrice(a), v=a.qty*up, c=a.kind==='cash'?v:a.qty*(a.cost||up), pnl=v-c, ch=S.prices[a.sym]?.chg;
    const qtyTxt = a.kind==='cash' ? '' : `${a.qty.toLocaleString('tr-TR',{maximumFractionDigits:6})} × ${fmt(up)}`;
    return `<div class="row tap" data-asset="${a.id}"><div class="ic">${AK[a.kind][0]}</div><div class="t"><b>${esc(a.name)}</b><span>${qtyTxt}${ch!=null&&a.kind!=='cash'&&a.kind!=='fund'?` · bugün ${ch>=0?'+':''}${ch}%`:''}${a.kind==='fund'?' · fiyat elle':''}</span></div>
      <div class="amt num">${fmt(v)}${a.kind!=='cash'?`<small class="${pnl>=0?'pos':'neg'}">${fmt(pnl,true)}</small>`:''}</div></div>`;
  }).join('') : '<div class="empty">Altın, döviz, hisse, fon, kripto ya da banka hesabını ekle; güncel değeriyle toplam servetini görürsün.</div>';
  // hedefler
  $('#goalList').innerHTML = S.goals.length ? S.goals.map(g=>{
    const r=Math.min(1,(g.saved||0)/g.target), left=Math.max(0,g.target-(g.saved||0));
    let tip=''; if(g.deadline && left>0){ const months=Math.max(1,(+g.deadline.slice(0,4)-new Date().getFullYear())*12+(+g.deadline.slice(5,7)-(new Date().getMonth()+1))); tip=` · ayda ${fmt(left/months)} biriktir`; }
    return `<div class="brow tap" data-goal="${g.id}" style="cursor:pointer"><div class="bh"><b>${esc(g.emoji||'🎯')} ${esc(g.name)}</b><span class="num">${fmt(g.saved||0)} / ${fmt(g.target)}</span></div>
      <div class="bar"><i style="width:${r*100}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="note" style="margin:0">%${Math.round(r*100)}${r>=1?' · 🎉 tamamlandı':tip}${g.deadline?' · hedef '+monthName(g.deadline):''}</span><button class="pill" data-gadd="${g.id}">+ Ekle</button></div></div>`;
  }).join('') : '<div class="empty">Örn: 🚗 Araba peşinatı, ✈️ Tatil, 🛟 Acil durum fonu</div>';
}

    if(f.kind==='crypto') fields+=`<label class="f"><span>Kripto kodu</span><input id="aCode" value="${esc(f.code)}" placeholder="Örn: BTC, ETH" autocapitalize="characters" autocomplete="off"></label>`;
    if(f.kind==='fund') fields+=`<label class="f"><span>Fon kodu</span><input id="aCode" value="${esc(f.code)}" placeholder="Örn: TTE" autocapitalize="characters" autocomplete="off"></label>`;
    if(f.kind==='cash') fields+=`<label class="f"><span>Hesap adı</span><input id="aName" value="${esc(f.name)}" placeholder="Örn: Vadeli hesap" autocomplete="off"></label>`;
  }
  const unit = {gold:f.sub==='GRAM'||f.sub==='GUMUS'?'gram':'adet', fx:'miktar', stock:'lot', crypto:'adet', fund:'pay', cash:'TL'}[f.kind];
  fields += f.kind==='cash'
    ? `<label class="f"><span>Tutar (TL)</span><input id="aQty" inputmode="decimal" value="${amtStr(+f.qty)}" placeholder="0"></label>`
    : `<div class="f2"><label class="f"><span>Miktar (${unit})</span><input id="aQty" inputmode="decimal" value="${f.qty!==''?amtStr(+f.qty):''}" placeholder="0"></label>
       <label class="f"><span>Birim maliyet (TL)</span><input id="aCost" inputmode="decimal" value="${f.cost?amtStr(+f.cost):''}" placeholder="boşsa güncel fiyat"></label></div>
       ${f.kind==='fund'?`<label class="f"><span>Güncel birim fiyat (TL)</span><input id="aMan" inputmode="decimal" value="${f.manual?amtStr(+f.manual):''}" placeholder="TEFAS'tan bak"></label><p class="note">Fon fiyatları otomatik çekilemiyor; ara ara buradan güncelle.</p>`:''}
       ${f.kind==='gold'&&f.sub!=='GRAM'&&f.sub!=='GUMUS'?'<p class="note">Sikke altın değeri saf altın gramından hesaplanır; kuyumcu fiyatı biraz farklı olabilir.</p>':''}`;
  openSheet(edit?esc(f.name):'Varlık ekle', fields + `<button class="btn" data-a="save" style="margin-top:6px">Kaydet</button>${edit?'<button class="btn danger" data-a="del">Varlığı sil</button>':''}`, assetFormClick);
}
function readAssetForm(){
  if($('#aCode')) af.code=$('#aCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if($('#aName')) af.name=$('#aName').value.trim();
  af.qty=parseAmt($('#aQty').value); if($('#aCost')) af.cost=parseAmt($('#aCost').value)||0; if($('#aMan')) af.manual=parseAmt($('#aMan').value)||0;
}
async function assetFormClick(e){
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.kind){ readAssetForm(); af.kind=b.dataset.kind; af.sub=af.kind==='gold'?'GRAM':af.kind==='fx'?'USDTRY=X':''; drawAssetForm(); return; }
  if(b.dataset.sub){ readAssetForm(); af.sub=b.dataset.sub; drawAssetForm(); return; }
  if(b.dataset.mkt){ readAssetForm(); af.mkt=b.dataset.mkt; drawAssetForm(); return; }
  if(b.dataset.a==='del'){ if(!confirm('Silinsin mi?')) return; S.assets=S.assets.filter(x=>x.id!==af.id); save(); closeSheet(); renderAll(); return; }
  if(b.dataset.a!=='save') return;
  readAssetForm();
  if(!(af.qty>0)) return toast('Miktarı yaz');
  if(af.id){ const a=S.assets.find(x=>x.id===af.id); Object.assign(a,{qty:af.qty, cost:af.cost||a.cost, manual:af.manual||a.manual}); save(); closeSheet(); renderAll(); return toast('Güncellendi'); }
  const a={id:uid(), kind:af.kind, qty:af.qty, cost:af.cost||0};
  if(af.kind==='gold'){ a.sym=af.sub; a.name=GOLD.find(g=>g[0]===af.sub)[1]; }
  else if(af.kind==='fx'){ a.sym=af.sub; a.name=FX.find(g=>g[0]===af.sub)[1]; }
  else if(af.kind==='stock'){ if(!af.code) return toast('Hisse kodunu yaz'); a.sym=af.mkt==='BIST'?af.code+'.IS':af.code; a.name=af.code; }
  else if(af.kind==='crypto'){ if(!af.code) return toast('Kodu yaz'); a.sym=af.code+'-USD'; a.name=af.code; }
  else if(af.kind==='fund'){ if(!af.code) return toast('Fon kodunu yaz'); a.name=af.code+' fonu'; a.manual=af.manual||af.cost; if(!a.cost) a.cost=a.manual; }
  else { a.name=af.name||'Nakit'; }
  b.disabled=true; b.textContent='Fiyat alınıyor…';
  if(a.sym){
    try{ const j=await (await fetch(PUSH_URL+'/prices?s='+encodeURIComponent(a.sym))).json(); const p=j.prices?.[a.sym];
      if(!p || !p.p){ b.disabled=false; b.textContent='Kaydet'; return toast('Fiyat bulunamadı, kodu kontrol et'); }
      S.prices[a.sym]={p:p.p, chg:p.chg, at:j.at};
    }catch(err){ if(!a.cost){ b.disabled=false; b.textContent='Kaydet'; return toast('İnternet yok; birim maliyeti elle yaz'); } }
    if(!a.cost) a.cost=S.prices[a.sym]?.p||0;
  }
  S.assets.push(a); save(); closeSheet(); renderAll(); buzz(); toast(`${AK[a.kind][0]} ${a.name} eklendi`);
}
$('#addAsset').onclick = () => assetForm();
$('#refreshP').onclick = () => fetchPrices(true);
$('#assetList').onclick = e => { const r=e.target.closest('[data-asset]'); if(r) assetForm(S.assets.find(a=>a.id===r.dataset.asset)); };

// hedefler
function goalForm(g){
  const f = g ? {...g} : {name:'', emoji:'🎯', target:0, saved:0, deadline:''};
  const EM=['🎯','🚗','🏠','✈️','💍','📱','🎓','🛟','💻','🏖️'];
  openSheet(g?'Hedefi düzenle':'Yeni hedef', `
    <div class="chips wrap">${EM.map(x=>`<button data-em="${x}" class="${f.emoji===x?'on':''}" style="font-size:18px">${x}</button>`).join('')}</div>
    <label class="f"><span>Hedef adı</span><input id="gName" value="${esc(f.name)}" placeholder="Örn: Araba peşinatı" autocomplete="off"></label>
    <div class="f2"><label class="f"><span>Hedef tutar</span><input id="gT" inputmode="decimal" value="${amtStr(f.target)}" placeholder="0 ₺"></label>
    <label class="f"><span>Biriken</span><input id="gS" inputmode="decimal" value="${amtStr(f.saved)}" placeholder="0 ₺"></label></div>
    <label class="f"><span>Hedef tarih (isteğe bağlı)</span><input type="month" id="gD" value="${f.deadline||''}"></label>
    <button class="btn" data-a="save">Kaydet</button>${g?'<button class="btn danger" data-a="del">Hedefi sil</button>':''}`, e => {
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.em){ f.emoji=b.dataset.em; $$('#shBody [data-em]').forEach(x=>x.classList.toggle('on',x===b)); return; }
      if(b.dataset.a==='del'){ if(!confirm('Silinsin mi?')) return; S.goals=S.goals.filter(x=>x.id!==g.id); save(); closeSheet(); renderAll(); return; }
      if(b.dataset.a!=='save') return;
      f.name=$('#gName').value.trim(); f.target=parseAmt($('#gT').value); f.saved=parseAmt($('#gS').value)||0; f.deadline=$('#gD').value;
      if(!f.name) return toast('Ad yaz'); if(!(f.target>0)) return toast('Hedef tutarı yaz');
      if(g) S.goals=S.goals.map(x=>x.id===g.id?{...x,...f}:x); else S.goals.push({...f, id:uid()});
      save(); closeSheet(); renderAll(); toast('Hedef kaydedildi 🎯');
    });
}
$('#addGoal').onclick = () => goalForm();
$('#goalList').onclick = e => {
  const add=e.target.closest('[data-gadd]');
  if(add){ const g=S.goals.find(x=>x.id===add.dataset.gadd);
    openSheet(`${g.emoji} ${esc(g.name)}`, `<p class="sub">Hedefe ne kadar ekliyorsun? (Eksi yazarsan çıkarır)</p><input class="amtin num" id="gAdd" inputmode="decimal" placeholder="0 ₺"><button class="btn" data-a="ok">Ekle</button>`, ev => {
      if(!ev.target.closest('[data-a=ok]')) return; const v=parseAmt($('#gAdd').value.replace('−','-')); if(!v) return toast('Tutar yaz');
      const before=(g.saved||0); g.saved=Math.max(0,before+v); save(); closeSheet(); renderAll(); buzz();
      toast(before<g.target && g.saved>=g.target ? `🎉 "${g.name}" hedefine ulaştın!` : `${fmt(v,true)} → %${Math.round(Math.min(1,g.saved/g.target)*100)}`);
    }); setTimeout(()=>$('#gAdd')?.focus(),300); return; }
  const r=e.target.closest('[data-goal]'); if(r) goalForm(S.goals.find(x=>x.id===r.dataset.goal));
};

// kategoriler
let catType='out';
function drawCats(){
  openSheet('Kategoriler', `<div class="seg"><button data-ct="out" class="${catType==='out'?'on':''}">Gider</button><button data-ct="in" class="${catType==='in'?'on':''}">Gelir</button></div>
    <div class="f2"><label class="f" style="flex:0 0 70px"><span>Emoji</span><input id="cEm" maxlength="4" placeholder="🏷️" style="text-align:center"></label><label class="f"><span>Yeni kategori</span><input id="cName" placeholder="Örn: Spor salonu" autocomplete="off"></label></div>
    <button class="btn" data-a="add">Ekle</button>
    <div class="card" style="margin-top:14px">${S.cats[catType].map(c=>`<div class="nrow"><span>${c.emoji} ${esc(c.name)}</span><button class="btn danger small" data-cdel="${c.id}">Sil</button></div>`).join('')}</div>`, e => {
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.ct){ catType=b.dataset.ct; drawCats(); return; }
      if(b.dataset.cdel){ if(S.cats[catType].length<=1) return; S.cats[catType]=S.cats[catType].filter(c=>c.id!==b.dataset.cdel); save(); drawCats(); renderAll(); return; }
      if(b.dataset.a==='add'){ const n=$('#cName').value.trim(); if(!n) return toast('Ad yaz'); S.cats[catType].push({id:uid(), name:n, emoji:$('#cEm').value.trim()||'🏷️'}); save(); drawCats(); toast('Eklendi'); }
    });
}
$('#editCats').onclick = drawCats;

// yedek
$('#exp').onclick = async () => {
  const data=JSON.stringify(S,null,1), name=`cuzdan-yedek-${today()}.json`, file=new File([data],name,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:'Cüzdan yedek'}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.click();
};
$('#imp').onchange = e => {
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.tx)) throw 0; S=Object.assign(defaults(),d); save(); renderAll(); toast('Yedek yüklendi ✓'); }catch(_){ toast('Geçersiz yedek dosyası'); } };
  r.readAsText(f); e.target.value='';
};
$('#wipe').onclick = () => { if(confirm('Tüm işlemler, ödemeler, varlıklar silinecek. Emin misin?')){ S=defaults(); save(); renderAll(); toast('Sıfırlandı'); } };

// ---------- bildirimler ----------
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isOn = () => S.notif.subscribed && pushOK() && Notification.permission==='granted';
function reminderDates(){
  const t=today(), until=addDays(t,60), set=new Set();
  for(const b of S.bills) for(const o of occUntil(b, until)){
    if(o.date<t){ set.add(t); continue; }
    set.add(o.date); const pre=addDays(o.date,-S.notif.daysBefore); if(pre>=t) set.add(pre);
  }
  for(const p of S.people) if(p.due && open(p)){
    if(p.due<t){ set.add(t); continue; }
    if(p.due<=until){ set.add(p.due); const pre=addDays(p.due,-S.notif.daysBefore); if(pre>=t) set.add(pre); }
  }
  return [...set].sort().slice(0,120);
}
const prefs = () => ({app:'cuzdan', hour:S.notif.hour, dates:reminderDates()});
function renderNotif(){
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let st;
  if(!standalone && /iPhone|iPad/.test(navigator.userAgent)) st='⚠️ Ödeme hatırlatmaları için önce Safari → Paylaş → <b>Ana Ekrana Ekle</b>, sonra ikondan aç.';
  else if(!pushOK()) st='Bu tarayıcı bildirimleri desteklemiyor.';
  else if(Notification.permission==='denied') st='Bildirim izni kapalı. iPhone Ayarlar → Bildirimler → Cüzdan.';
  else if(isOn()) st='✅ Ödeme hatırlatmaları açık.';
  else st='Ödeme günü yaklaşınca bildirim gelsin.';
  $('#nStatus').innerHTML=st;
  $('#nOn').textContent = isOn() ? 'Bildirimleri kapat' : '🔔 Bildirimleri aç';
  $('#nTest').style.display = isOn() ? '' : 'none';
  $('#nRows').innerHTML = `<div class="nrow"><span>⏰ Hatırlatma saati</span><select data-n="hour">${Array.from({length:24},(_,i)=>`<option value="${i}" ${S.notif.hour===i?'selected':''}>${pad(i)}:00</option>`).join('')}</select></div>
    <div class="nrow"><span>📅 Kaç gün önce</span><select data-n="daysBefore">${[0,1,2,3,5,7].map(i=>`<option value="${i}" ${S.notif.daysBefore===i?'selected':''}>${i?i+' gün önce':'Sadece günü'}</option>`).join('')}</select></div>`;
}
function b64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); s+='='.repeat((4-s.length%4)%4); return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function api(path, body){
  const r=await fetch(PUSH_URL+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||j.detail||('HTTP '+r.status)); return j;
}
async function getSub(create){
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(!sub && create) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUBLIC)});
  return sub;
}
let lastSync='';
async function syncPush(){ if(!isOn()) return; const p=prefs(), k=JSON.stringify(p); if(k===lastSync) return;
  try{ const sub=await getSub(false); if(sub){ await api('/subscribe',{sub:sub.toJSON(), prefs:p}); lastSync=k; } }catch(e){} }
$('#nOn').onclick = async () => {
  try{
    if(isOn()){ const sub=await getSub(false); if(sub){ await api('/unsubscribe',{endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe(); } S.notif.subscribed=false; save(); renderNotif(); return toast('Bildirimler kapatıldı'); }
    if(!pushOK()) return toast('Önce ana ekrana ekle 📲');
    const p=await Notification.requestPermission(); if(p!=='granted'){ renderNotif(); return toast('İzin verilmedi'); }
    const sub=await getSub(true); await api('/subscribe',{sub:sub.toJSON(), prefs:prefs()});
    S.notif.subscribed=true; save(); renderNotif(); toast('🔔 Ödeme hatırlatmaları açık');
  }catch(e){ renderNotif(); toast('Hata: '+String(e.message||e).slice(0,60)); }
};
$('#nRows').onchange = e => { const s=e.target.closest('[data-n]'); if(!s) return; S.notif[s.dataset.n]=+s.value; save(); };
$('#nTest').onclick = async () => {
  try{ S.testAt=Date.now(); save(); await writeSnap(); const sub=await getSub(false); if(!sub) return toast('Abonelik yok');
    await api('/test',{endpoint:sub.endpoint}); toast('Gönderildi, birkaç saniyede gelir'); }catch(e){ toast('Hata: '+String(e.message||e).slice(0,60)); }
};
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('cuzdan',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function writeSnap(){
  try{
    const t=today(), until=addDays(t,10), items=[];
    for(const b of S.bills) for(const o of occUntil(b,until)) items.push({name:b.name, amount:b.amount, date:o.date, inc:b.kind==='alacak'});
    for(const p of S.people) if(p.due && open(p) && p.due<=until){ const b=bal(p); items.push({name:(b<0?'Borç: ':'Alacak: ')+p.name, amount:Math.abs(b), date:p.due, inc:b>0}); }
    items.sort((a,b)=>a.date.localeCompare(b.date));
    const snap={date:t, items:items.slice(0,12), testAt:S.testAt||0};
    const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(snap,'snap'); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); db.close();
  }catch(e){}
}

// ---------- sekmeler & ay ----------
function goTab(v){
  $$('nav button[data-v]').forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  $$('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
  if(v==='assets'){ renderNotif(); fetchPrices(); }
  window.scrollTo(0,0);
}
$('#tabs').onclick = e => { const b=e.target.closest('button[data-v]'); if(b) goTab(b.dataset.v); };
document.addEventListener('click', e => { const b=e.target.closest('[data-mn]'); if(b){ curM=addMonths(curM,+b.dataset.mn); renderAll(); } });

function renderAll(){
  $$('.mTitle').forEach(x=>x.textContent=monthName(curM)+(curM===mkey()?'':''));
  renderHome(); renderTx(); renderBills(); renderPeople(); renderNeeds(); renderAssets(); renderNotif();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ renderAll(); fetchPrices(); } });

migrate(); setSeg(S.ui.billSeg||'pay'); renderAll(); writeSnap(); syncPush(); fetchPrices();
const qp=new URLSearchParams(location.search).get('tab'); if(qp){ history.replaceState(null,'',location.pathname); goTab(qp); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{ if(e.data==='bills') goTab('bills'); });
}
// ---------- otomatik güncelleme: yeni sürüm yayınlanınca uygulama kendini yeniler ----------
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadCtl = !!navigator.serviceWorker.controller; let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadCtl && !reloading){ reloading = true; location.reload(); } });
  navigator.serviceWorker.getRegistration().then(reg => { if(!reg) return;
    document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); }); });
}
})();
